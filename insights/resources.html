<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Resources | Neuro Mates</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <style>
    .empty-state-section {
      position: relative;
      min-height: 52vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: clamp(60px, 8vw, 100px) 0;
    }
    #signal-wave-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .empty-card {
      position: relative;
      z-index: 2;
      background: #FFFFFF;
      border: 1px solid rgba(14,59,67,0.08);
      border-radius: 28px;
      padding: clamp(32px, 6vw, 64px);
      text-align: center;
      box-shadow: 0 16px 40px rgba(14,59,67,0.04);
      max-width: 640px;
      margin: 0 auto;
    }
    .empty-line {
      font-family: var(--fd);
      font-size: clamp(1.4rem, 2.5vw, 1.8rem);
      color: var(--mu);
      font-style: italic;
      margin: 20px 0 32px;
    }
    @media (max-width: 480px) {
      .empty-card {
        padding: 32px 18px;
        border-radius: 22px;
      }
      .empty-line {
        font-size: 1.3rem;
        margin: 16px 0 24px;
      }
    }
  </style>
</head>
<body>
  <div id="care"></div>
  <nav id="nav"></nav>

  <main id="main-content">
    <header class="hero" style="padding-top:clamp(110px, 15vw, 160px);padding-bottom:clamp(32px, 5vw, 56px);">
      <div class="w">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../index.html">Home</a>
          <span class="sep">/</span>
          <a href="index.html">Insights</a>
          <span class="sep">/</span>
          <span class="current">Resources</span>
        </nav>
        <span class="ey">EDUCATIONAL MATERIAL</span>
        <h1>Resources</h1>
        <p class="lead">Reports, references and educational material.</p>
      </div>
    </header>

    <section class="empty-state-section">
      <canvas id="signal-wave-canvas" aria-hidden="true"></canvas>
      <div class="w">
        <div class="empty-card">
          <div class="empty-line">Resources will appear here.</div>
          <a class="b2" href="index.html">&larr; Back to Insights Overview</a>
        </div>
      </div>
    </section>

    <section class="cta" id="global-cta"></section>
  </main>

  <footer id="global-footer"></footer>
  <script src="../assets/js/shared.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('nav').innerHTML = window.NeuroShared.getNavHTML('insights');
      document.getElementById('global-cta').innerHTML = window.NeuroShared.getCTAHTML();
      document.getElementById('global-footer').innerHTML = window.NeuroShared.getFooterHTML();

      const cvs = document.getElementById('signal-wave-canvas');
      if (cvs) {
        const ctx = cvs.getContext('2d');
        let t = 0;
        function resize() {
          cvs.width = cvs.offsetWidth;
          cvs.height = cvs.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawWave() {
          const w = cvs.width;
          const h = cvs.height;
          ctx.clearRect(0, 0, w, h);

          ctx.strokeStyle = 'rgba(110, 193, 240, 0.22)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let x = 0; x < w; x++) {
            const y = h / 2 + Math.sin(x * 0.009 + t * 0.018) * 22 + Math.cos(x * 0.005 - t * 0.02) * 18;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          t++;
          requestAnimationFrame(drawWave);
        }
        drawWave();
      }
    });
  </script>
</body>
</html>
